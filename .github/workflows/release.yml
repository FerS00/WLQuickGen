name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release tagged with the version from CMakeLists.txt
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: x86
            platform: Win32
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Check architecture
        shell: pwsh
        run: |
          $exe = "build/bin/Release/WLQuickGen-${{ matrix.arch }}.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $expected = if ('${{ matrix.arch }}' -eq 'x64') { 0x8664 } else { 0x14c }
          if ($machine -ne $expected) { throw "Unexpected machine 0x$($machine.ToString('x'))" }

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME }
            elseif ('${{ inputs.release }}' -eq 'true') { 'v' + ([regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(WLQuickGen VERSION ([0-9.]+)').Groups[1].Value) }
            else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $name = "WLQuickGen-$version-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item "build/bin/Release/WLQuickGen-${{ matrix.arch }}.exe" "dist/$name/"
          Copy-Item README.md, LICENSE, examples/automate.py "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash + "  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^project(WLQuickGen VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: |
          version="${TAG#v}"
          awk -v header="## [$version]" 'index($0, header) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > notes.md
          echo >> notes.md
          echo "### SHA-256" >> notes.md
          echo '```' >> notes.md
          cat dist/*.sha256 >> notes.md
          echo '```' >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: WLQuickGen ${{ env.TAG }}
          body_path: notes.md
          files: |
            dist/*.zip
            dist/*.sha256
